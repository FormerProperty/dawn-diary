name = "dawn-diary"
main = "src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "dawn-diary"
database_id = "7c7f25b4-f950-4b28-b296-64fca69298ff"

[triggers]
# Every 5 minutes: checks whether any nudges are due.
crons = ["*/5 * * * *"]

[vars]
OWNER_NAME = "Tanya"
PARTNER_NAME = "Dawn"
# Sent with push notifications so the push service knows who runs the app.
PUSH_CONTACT = "https://dawnsdiary.uk"
AI_MODEL = "claude-haiku-5-5"

# Custom domain: dawnsdiary.uk is added in the dashboard (Worker > Settings > Domains & Routes).

# Secrets (set in the dashboard, never in this file):
#   APP_PASSPHRASE     the passphrase Tanya uses to sign in
#   ANTHROPIC_API_KEY  for understanding what is said or typed
